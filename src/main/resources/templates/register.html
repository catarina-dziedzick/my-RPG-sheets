<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro | MyRPG Sheets</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="auth-bg">

<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="auth-card">
        <div class="text-center mb-4">
            <h1 class="fw-bold">Criar conta</h1>
            <p class="text-muted">Comece a organizar suas fichas de RPG</p>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form method="post" action="/register" th:object="${user}">
            <div class="mb-3">
                <label class="form-label">Nome Completo</label>
                <input type="text" th:field="*{name}" class="form-control form-control-lg" placeholder="Seu nome">

                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" th:field="*{email}" class="form-control form-control-lg" placeholder="seuemail@email.com">

                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Nome de Usuário</label>
                <input type="text" th:field="*{userName}" class="form-control form-control-lg" placeholder="nome.usuario">

                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}"></div>
            </div>

            <div class="mb-4">
                <label class="form-label">Senha</label>
                <input type="password" th:field="*{password}" class="form-control form-control-lg" placeholder="Crie uma senha">

                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <button type="submit" class="btn btn-warning btn-lg w-100 fw-semibold">
                Cadastrar
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="mb-0">
                Já tem conta?
                <a href="/login" class="fw-semibold text-decoration-none">Entrar</a>
            </p>

            <a href="/" class="small text-muted text-decoration-none">Voltar para início</a>
        </div>
    </div>
</div>

</body>
</html>
