<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MyRPG Sheets</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="home-bg">

<nav class="navbar navbar-expand-lg navbar-dark bg-transparent px-4 py-3">
    <a class="navbar-brand fw-bold fs-3" href="/">MyRPG Sheets</a>
</nav>

<main class="container d-flex align-items-center justify-content-center min-vh-100">
    <section class="hero-card text-center">
        <span class="badge text-bg-warning mb-3">Ficha de RPG Online</span>

        <h1 class="display-4 fw-bold mb-3">
            Crie suas fichas de RPG com estilo
        </h1>

        <p class="lead mb-4 text-light opacity-75">
            Organize personagens, atributos, pontos de vida, descrições e avatares em um sistema simples, bonito e funcional.
        </p>

        <div class="d-flex gap-3 justify-content-center flex-wrap">
            <a href="/login" class="btn btn-warning btn-lg px-4 fw-semibold">Entrar</a>
            <a href="/register" class="btn btn-outline-light btn-lg px-4">Criar conta</a>
        </div>
    </section>

</body>
</html>
