<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Minhas Fichas | MyRPG Sheets</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="app-bg">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/characters">MyRPG Sheets</a>

    <div class="ms-auto d-flex align-items-center gap-3">
        <span class="text-light small" th:text="'Olá, ' + ${user.name}"></span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Sair</a>
    </div>
</nav>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <h1 class="fw-bold mb-1">Minhas fichas</h1>
            <p class="text-muted mb-0">Gerencie seus personagens de RPG.</p>
        </div>

        <a href="/characters/new" class="btn btn-warning btn-lg fw-semibold">
            + Nova ficha
        </a>
    </div>

    <div th:if="${#lists.isEmpty(characters)}" class="empty-state text-center">
        <h2 class="fw-bold">Nenhuma ficha criada ainda</h2>
        <p class="text-muted">Crie seu primeiro personagem para começar sua aventura.</p>
        <a href="/characters/new" class="btn btn-warning fw-semibold">Criar personagem</a>
    </div>

    <div class="row g-4" th:if="${!#lists.isEmpty(characters)}">
        <div class="col-md-6 col-lg-4" th:each="character : ${characters}">
            <div class="card character-card h-100">
                <div class="card-body">
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <img class="avatar"
                             th:src="${character.avatarUrl != null && character.avatarUrl != '' ? character.avatarUrl : '/img/default-avatar.jpg'}"
                             alt="Avatar">

                        <div>
                            <h4 class="fw-bold mb-0" th:text="${character.name}">Nome</h4>
                            <p class="text-muted mb-0">
                                <span th:text="${character.race}">Raça</span>
                                •
                                <span th:text="${character.characterClass}">Classe</span>
                            </p>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between bg-light rounded-3 p-3 mb-3">
                        <div>
                            <small class="text-muted">Nível</small>
                            <div class="fw-bold" th:text="${character.level}">1</div>
                        </div>

                        <div>
                            <small class="text-muted">PV</small>
                            <div class="fw-bold" th:text="${character.hitPoints}">10</div>
                        </div>

                        <div>
                            <small class="text-muted">FOR</small>
                            <div class="fw-bold" th:text="${character.strength}">10</div>
                        </div>
                    </div>

                    <p class="text-muted character-description" th:text="${character.description}">
                        Descrição do personagem.
                    </p>

                    <div class="d-flex gap-2 mt-3">
                        <a th:href="@{/characters/view/{id}(id=${character.id})}" class="btn btn-dark flex-fill">
                            Ver
                        </a>

                        <a th:href="@{/characters/delete/{id}(id=${character.id})}"
                           class="btn btn-outline-danger flex-fill"
                           onclick="return confirm('Tem certeza que deseja excluir esta ficha?')">
                            Excluir
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
