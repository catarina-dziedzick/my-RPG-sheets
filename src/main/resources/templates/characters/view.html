<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${character.name} + ' | MyRPG Sheets'">Ficha | MyRPG Sheets</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="app-bg">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/characters">MyRPG Sheets</a>

    <div class="ms-auto">
        <a href="/characters" class="btn btn-outline-light btn-sm">Voltar</a>
    </div>
</nav>

<main class="container py-5">
    <section class="sheet-card">
        <div class="row g-4 align-items-center mb-4">
            <div class="col-md-3 text-center">
                <img class="sheet-avatar"
                     th:src="${character.avatarUrl != null && character.avatarUrl != '' ? character.avatarUrl : '/img/default-avatar.jpg'}"
                     alt="Avatar do personagem">
            </div>

            <div class="col-md-9">
                <span class="badge text-bg-warning mb-2">Ficha de Personagem</span>

                <h1 class="display-5 fw-bold mb-2" th:text="${character.name}">
                    Nome do Personagem
                </h1>

                <p class="lead text-muted mb-0">
                    <span th:text="${character.race}">Raça</span>
                    •
                    <span th:text="${character.characterClass}">Classe</span>
                    • Nível
                    <span th:text="${character.level}">1</span>
                </p>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="info-box">
                    <span>Pontos de Vida</span>
                    <strong th:text="${character.hitPoints}">10</strong>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <div class="info-box">
                    <span>Nível</span>
                    <strong th:text="${character.level}">1</strong>
                </div>
            </div>
        </div>

        <h3 class="fw-bold mb-3">Atributos</h3>

        <div class="row g-3 mb-4">
            <div class="col-6 col-md-2">
                <div class="stat-box">
                    <div class="stat-number" th:text="${character.strength}">10</div>
                    <div class="stat-label">Força</div>
                </div>
            </div>

            <div class="col-6 col-md-2">
                <div class="stat-box">
                    <div class="stat-number" th:text="${character.dexterity}">10</div>
                    <div class="stat-label">Destreza</div>
                </div>
            </div>

            <div class="col-6 col-md-2">
                <div class="stat-box">
                    <div class="stat-number" th:text="${character.constitution}">10</div>
                    <div class="stat-label">Constituição</div>
                </div>
            </div>

            <div class="col-6 col-md-2">
                <div class="stat-box">
                    <div class="stat-number" th:text="${character.intelligence}">10</div>
                    <div class="stat-label">Inteligência</div>
                </div>
            </div>

            <div class="col-6 col-md-2">
                <div class="stat-box">
                    <div class="stat-number" th:text="${character.wisdom}">10</div>
                    <div class="stat-label">Sabedoria</div>
                </div>
            </div>

            <div class="col-6 col-md-2">
                <div class="stat-box">
                    <div class="stat-number" th:text="${character.charisma}">10</div>
                    <div class="stat-label">Carisma</div>
                </div>
            </div>
        </div>

        <h3 class="fw-bold mb-3">Descrição</h3>

        <div class="description-box">
            <p class="mb-0" th:text="${character.description}">
                Descrição do personagem.
            </p>
        </div>

        <div class="d-flex gap-3 mt-4 flex-wrap">
            <a th:href="@{/characters/edit/{id}(id=${character.id})}" class="btn btn-warning btn-lg fw-semibold">
                Editar ficha
            </a>
            <a href="/characters" class="btn btn-outline-secondary btn-lg">
                Voltar ao dashboard
            </a>
        </div>

    </section>
</main>

</body>
</html>
