<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <title th:text="${character.id == null ? 'Nova Ficha | MyRPG Sheets' : 'Editar Ficha | MyRPG Sheets'}">
        Ficha | MyRPG Sheets
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="app-bg">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/characters">MyRPG Sheets</a>

    <div class="ms-auto">
        <a href="/characters" class="btn btn-outline-light btn-sm">Voltar</a>
    </div>
</nav>

<main class="container py-5">
    <div class="form-shell">
        <div class="mb-4">
            <h1 class="fw-bold mb-1" th:text="${character.id == null ? 'Nova ficha' : 'Editar ficha'}">
                Nova ficha
            </h1>

            <p class="text-muted mb-0" th:text="${character.id == null ? 'Preencha os dados principais do seu personagem.' : 'Atualize as informações da sua ficha.'}">
                Preencha os dados principais do seu personagem.
            </p>
        </div>

        <form method="post" action="/characters/save" th:object="${character}" enctype="multipart/form-data">

            <input type="hidden" th:field="*{id}">

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nome do personagem</label>
                    <input type="text" th:field="*{name}" class="form-control form-control-lg" placeholder="Ex: Arannis Lua Negra">

                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Raça</label>
                    <input type="text" th:field="*{race}" class="form-control form-control-lg" placeholder="Elfo">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Classe</label>
                    <input type="text" th:field="*{characterClass}" class="form-control form-control-lg" placeholder="Mago">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Nível</label>
                    <input type="number" th:field="*{level}" class="form-control form-control-lg" min="1">

                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('level')}" th:errors="*{level}"></div>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Pontos de Vida</label>
                    <input type="number" th:field="*{hitPoints}" class="form-control form-control-lg" min="0" placeholder="10">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Classe de Armadura</label>
                    <input type="number" th:field="*{armorClass}" class="form-control form-control-lg" min="0" placeholder="15">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Atributo de Conjuração</label>
                    <select th:field="*{spellcastingAbility}" class="form-select form-select-lg">
                        <option value="">Nenhum</option>
                        <option value="intelligence">Inteligência</option>
                        <option value="wisdom">Sabedoria</option>
                        <option value="charisma">Carisma</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Avatar do personagem</label>
                    <input type="file" name="avatarFile" class="form-control form-control-lg" accept="image/*">
                    <small class="text-muted">Envie uma imagem para substituir o avatar atual.</small>
                </div>

                <div class="col-md-6" th:if="${character.id != null && character.hasAvatar()}">
                    <label class="form-label d-block">Avatar atual</label>
                    <img th:src="@{/characters/{id}/avatar(id=${character.id})}"
                         alt="Avatar atual"
                         style="width: 110px; height: 110px; object-fit: cover; border-radius: 50%; border: 2px solid #f5f5f5;">

                    <div class="mt-2">
                        <button type="submit"
                                form="remove-avatar-form"
                                class="btn btn-outline-danger btn-sm"
                                onclick="return confirm('Deseja remover o avatar atual?')">
                            Remover avatar
                        </button>
                    </div>
                </div>
            </div>

            <hr class="my-4">

            <h4 class="fw-bold mb-3">Atributos</h4>

            <div class="row g-3">
                <div class="col-6 col-md-2">
                    <label class="form-label">Força</label>
                    <input type="number" th:field="*{strength}" class="form-control form-control-lg">
                </div>

                <div class="col-6 col-md-2">
                    <label class="form-label">Destreza</label>
                    <input type="number" th:field="*{dexterity}" class="form-control form-control-lg">
                </div>

                <div class="col-6 col-md-2">
                    <label class="form-label">Constituição</label>
                    <input type="number" th:field="*{constitution}" class="form-control form-control-lg">
                </div>

                <div class="col-6 col-md-2">
                    <label class="form-label">Inteligência</label>
                    <input type="number" th:field="*{intelligence}" class="form-control form-control-lg">
                </div>

                <div class="col-6 col-md-2">
                    <label class="form-label">Sabedoria</label>
                    <input type="number" th:field="*{wisdom}" class="form-control form-control-lg">
                </div>

                <div class="col-6 col-md-2">
                    <label class="form-label">Carisma</label>
                    <input type="number" th:field="*{charisma}" class="form-control form-control-lg">
                </div>
            </div>

            <div class="mt-4">
                <label class="form-label">Descrição</label>
                <textarea th:field="*{description}" class="form-control" rows="5" placeholder="Conte um pouco sobre a história, personalidade ou aparência do personagem."></textarea>
            </div>

            <div class="d-flex gap-3 mt-4 flex-wrap">
                <button type="submit" class="btn btn-warning btn-lg fw-semibold"
                        th:text="${character.id == null ? 'Salvar ficha' : 'Atualizar ficha'}">
                    Salvar ficha
                </button>

                <a href="/characters" class="btn btn-outline-secondary btn-lg">
                    Cancelar
                </a>
            </div>
        </form>

        <form id="remove-avatar-form"
              th:if="${character.id != null && character.hasAvatar()}"
              method="post"
              th:action="@{/characters/{id}/avatar/remove(id=${character.id})}">
        </form>
    </div>
</main>

</body>
</html>
