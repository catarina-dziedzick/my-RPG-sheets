<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nova Campanha | MyRPG Sheets</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="app-bg">

<div th:replace="~{fragments/navbar :: appNavbar}"></div>

<main class="container py-5">
    <section class="form-shell">
        <h1 class="fw-bold mb-1">Criar campanha</h1>
        <p class="text-muted mb-4">Crie uma sala para sua mesa de RPG.</p>

        <form method="post" action="/campaigns/save" th:object="${campaign}">
            <div class="mb-3">
                <label class="form-label">Nome da campanha</label>
                <input type="text" th:field="*{name}" class="form-control form-control-lg" placeholder="Ex: Ilhas de Delíria" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Descrição</label>
                <textarea th:field="*{description}" class="form-control" rows="5" placeholder="Resumo da campanha, tom da aventura ou informações para os jogadores."></textarea>
            </div>

            <button type="submit" class="btn btn-warning btn-lg fw-semibold">
                Criar campanha
            </button>

            <a href="/campaigns" class="btn btn-outline-secondary btn-lg">
                Cancelar
            </a>
        </form>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
