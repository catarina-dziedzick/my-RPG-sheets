<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Entrar em Campanha | MyRPG Sheets</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="app-bg">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/dashboard">MyRPG Sheets</a>

    <div class="ms-auto">
        <a href="/campaigns" class="btn btn-outline-light btn-sm">Voltar</a>
    </div>
</nav>

<main class="container py-5">
    <section class="form-shell">
        <h1 class="fw-bold mb-1">Entrar em campanha</h1>
        <p class="text-muted mb-4">Digite o código de convite enviado pelo mestre.</p>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form method="post" action="/campaigns/join">
            <div class="mb-4">
                <label class="form-label">Código de convite</label>
                <input type="text" name="inviteCode" class="form-control form-control-lg text-uppercase" placeholder="ABC123" required>
            </div>

            <button type="submit" class="btn btn-warning btn-lg fw-semibold">
                Entrar
            </button>

            <a href="/campaigns" class="btn btn-outline-secondary btn-lg">
                Cancelar
            </a>
        </form>
    </section>
</main>

</body>
</html>
