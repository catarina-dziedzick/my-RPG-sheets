<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login | MyRPG Sheets</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="auth-bg">

<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="auth-card">
        <div class="text-center mb-4">
            <h1 class="fw-bold">MyRPG Sheets</h1>
            <p class="text-muted">Entre para acessar suas fichas</p>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form method="post" action="/login">
            <div class="mb-3">
                <label class="form-label">E-mail ou Nome de Usuário</label>
                <input type="text" name="identifier" class="form-control form-control-lg" placeholder="Email ou usuário" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Senha</label>
                <input type="password" name="password" class="form-control form-control-lg" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn btn-warning btn-lg w-100 fw-semibold">
                Entrar
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="mb-0">
                Ainda não tem conta?
                <a href="/register" class="fw-semibold text-decoration-none">Cadastre-se</a>
            </p>

            <a href="/" class="small text-muted text-decoration-none">Voltar para início</a>
        </div>
    </div>
</div>

</body>
</html>
